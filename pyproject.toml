[project]
name = "janrakshak-ai"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Django>=4.2,<5.0",
    "whitenoise>=6.5.0",
    "django-cors-headers>=4.2.0",
    "django-environ>=0.10.0",
    "python-dotenv>=1.0.0",
    "psycopg2-binary>=2.9.0",
    "dj-database-url>=2.1.0",
    "Pillow>=10.0.0",
    "cloudinary>=1.36.0",
    "django-cloudinary-storage>=0.3.0",
    "djangorestframework>=3.14.0",
    "django-filter>=23.0",
    "requests>=2.31.0",
    "sentry-sdk>=1.32.0",
]

[tool.vercel]
entrypoint = "janrakshak_django.wsgi:application"
